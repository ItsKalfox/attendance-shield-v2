    <title>Attendance Shield</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

  <body style="margin: 0; background-color: #0c2b27;">
    <div id="root">
      <div style="min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0c2b27; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
        <div style="position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
          <div style="position: absolute; width: 64px; height: 64px; border-radius: 9999px; background: rgba(16, 185, 129, 0.2); animation: splash-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;"></div>
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="position: relative; z-index: 1;">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <div style="font-size: 19px; font-weight: 700; letter-spacing: -0.02em; color: #ffffff; margin-bottom: 8px;">Attendance Shield</div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: rgba(110, 231, 183, 0.85);">
          <div style="width: 7px; height: 7px; border-radius: 50%; background: #10b981; animation: splash-ping 1.2s cubic-bezier(0, 0, 0.2, 1) infinite;"></div>
          <span id="splash-status">Connecting secure session...</span>
        </div>
        <button id="splash-retry-btn" onclick="if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(regs){for(var r of regs)r.unregister();window.location.reload(true);});}else{window.location.reload(true);}" style="display: none; margin-top: 16px; padding: 7px 18px; font-size: 12px; font-weight: 600; color: #0c2b27; background: #10b981; border: none; border-radius: 9999px; cursor: pointer; box-shadow: 0 4px 12px rgba(16,185,129,0.3); transition: transform 0.1s;">
          Reload Session
        </button>
        <script>
          window.__splashTimeout = setTimeout(function() {
            var btn = document.getElementById('splash-retry-btn');
            var status = document.getElementById('splash-status');
            if (btn) btn.style.display = 'inline-block';
            if (status) status.textContent = 'Taking longer than usual over LAN...';
          }, 10000);
          window.addEventListener('error', function() {
            var btn = document.getElementById('splash-retry-btn');
            if (btn) btn.style.display = 'inline-block';
          });
        </script>
        <style>
          @keyframes splash-pulse { 0%, 100% { transform: scale(1); opacity: 0.25; } 50% { transform: scale(1.35); opacity: 0.6; } }
          @keyframes splash-ping { 75%, 100% { transform: scale(2.2); opacity: 0; } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
